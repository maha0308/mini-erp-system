<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini ERP System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', sans-serif;
        }
        .sidebar {
            height: 100vh;
            background: linear-gradient(180deg, #1a1a2e, #16213e);
            padding-top: 20px;
            position: fixed;
            width: 230px;
            box-shadow: 3px 0 10px rgba(0,0,0,0.2);
        }
        .sidebar h4 {
            color: #00d4ff;
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .sidebar a {
            color: #ccc;
            display: block;
            padding: 13px 25px;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
            border-left: 3px solid transparent;
        }
        .sidebar a:hover {
            background-color: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            border-left: 3px solid #00d4ff;
        }
        .main-content {
            margin-left: 240px;
            padding: 30px;
        }
        .card {
            border: none;
            border-radius: 12px;
        }
        .page-title {
            font-weight: bold;
            color: #1a1a2e;
            margin-bottom: 25px;
            border-left: 5px solid #00d4ff;
            padding-left: 12px;
        }
        .table thead {
            font-size: 14px;
        }
        .btn {
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h4><i class="bi bi-grid-fill"></i> Mini ERP</h4>
        <a href="/"><i class="bi bi-house-fill me-2"></i> Dashboard</a>
        <a href="/inventory"><i class="bi bi-box-seam me-2"></i> Inventory</a>
        <a href="/sales"><i class="bi bi-cart-fill me-2"></i> Sales</a>
        <a href="/reports"><i class="bi bi-bar-chart-fill me-2"></i> Reports</a>
    </div>

    <!-- CONTENT -->
    <div class="main-content">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
