{% extends 'base.html' %}

{% block content %}
<h2 class="page-title">✏️ Edit Product</h2>

<div class="card p-4 bg-white shadow-sm" style="max-width: 600px;">
    <form action="/update_product/{{ product['id'] }}" method="POST">
        <div class="mb-3">
            <label class="form-label fw-bold">Product Name</label>
            <input type="text" name="name" class="form-control"
                   value="{{ product['name'] }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Category</label>
            <input type="text" name="category" class="form-control"
                   value="{{ product['category'] }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Quantity</label>
            <input type="number" name="quantity" class="form-control"
                   value="{{ product['quantity'] }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Price (₹)</label>
            <input type="number" step="0.01" name="price" class="form-control"
                   value="{{ product['price'] }}" required>
        </div>
        <button type="submit" class="btn btn-success w-100">
            <i class="bi bi-check-circle me-2"></i>Update Product
        </button>
        <a href="/inventory" class="btn btn-secondary w-100 mt-2">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
